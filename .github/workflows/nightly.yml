name: Nightly Build
on:
  workflow_dispatch: ~
  schedule:
    - cron: '0 0 * * *'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, mbstring, xml
          coverage: none

      - name: Build package
        run: make build

      - name: Rename package
        run: mv build.zip gitlist-nightly.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: nightly
          tag_name: nightly
          prerelease: true
          body: Nightly release generated from `master` at 12 AM UTC.
          files: gitlist-nightly.zip
